<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2442">
<title>جواز الصحة الوقائية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0B2442; --navy2:#16355F; --gold:#C6912E; --gold-l:#F7EDD6;
  --bg:#F3F5F9; --card:#FFFFFF; --soft:#EEF2F8; --line:#DDE3EC; --txt:#172538; --mut:#66758A;
  --ok:#2E8B63; --mid:#D39A1F; --low:#D2573B; --on-navy:#fff;
  --shadow:0 1px 2px rgba(11,36,66,.05),0 8px 24px rgba(11,36,66,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1423; --card:#111F35; --soft:#17283F; --line:#243752; --txt:#E8EEF7; --mut:#94A3B8;
    --gold-l:#2A2415; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0A1423; --card:#111F35; --soft:#17283F; --line:#243752; --txt:#E8EEF7; --mut:#94A3B8;
  --gold-l:#2A2415; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Tajawal',system-ui,sans-serif;font-size:16px;line-height:1.65;padding-bottom:84px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.hidden{display:none!important}
button{font:inherit;cursor:pointer}
/* ---------- cards ---------- */
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line)}
.card h2{margin:0 0 4px;font-size:20px;color:var(--navy)} :root[data-theme="dark"] .card h2{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .card h2{color:#fff}}
.card h3{margin:0 0 10px;font-size:16.5px;display:flex;align-items:center;gap:8px}
.sub{color:var(--mut);font-size:14px;margin:0 0 10px}
.note{background:var(--gold-l);border-radius:14px;padding:10px 14px;font-size:14px}
.tiny{font-size:12.5px;color:var(--mut)}
/* ---------- hero ---------- */
.hero{background:linear-gradient(150deg,var(--navy),var(--navy2) 70%);color:var(--on-navy);border-radius:26px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset-inline-start:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(198,145,46,.35),transparent 70%)}
.hero .hi{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;position:relative;z-index:1}
.avatar{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font-size:24px;flex:none}
.hero .row{display:flex;align-items:center;gap:16px;margin-top:14px;position:relative;z-index:1}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:38px;line-height:1}
.ring b small{font-size:12px;font-weight:500;opacity:.75;margin-top:4px}
.lvl{display:inline-block;border-radius:20px;padding:3px 14px;font-weight:700;font-size:14px;color:#fff}
.hero .meta{font-size:14px;opacity:.9}
.delta{display:inline-flex;gap:4px;align-items:center;background:rgba(255,255,255,.14);border-radius:12px;padding:2px 10px;font-size:13px;margin-top:6px}
/* ---------- alerts ---------- */
.alert{border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:15px;border:1.5px solid}
.alert.refer{background:rgba(210,87,59,.10);border-color:var(--low)}
.alert.watch{background:rgba(211,154,31,.12);border-color:var(--mid)}
.alert.good{background:rgba(46,139,99,.10);border-color:var(--ok)}
/* ---------- metric grid ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{background:var(--soft);border-radius:18px;padding:12px;text-align:start;border:1.5px solid transparent;color:inherit;width:100%}
.mc.pri{border-color:var(--low)}
.mc .t{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14.5px}
.mc .v{font-size:24px;font-weight:800;margin:2px 0}
.mc .st{font-size:12.5px;color:var(--mut)}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:4px}
.mc.empty{opacity:.75;border:1.5px dashed var(--line);background:transparent}
.mc .tip{display:none;font-size:13px;margin-top:8px;color:var(--txt)}
.mc.open .tip{display:block}
.badge{font-size:11px;background:var(--low);color:#fff;border-radius:8px;padding:0 7px}
/* ---------- CKM ---------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:12px}
.tile{background:var(--soft);border-radius:16px;padding:10px 8px;text-align:center;border:1.5px solid transparent;font-size:12.5px}
.tile b{display:block;font-size:13.5px}.tile span{display:block;color:var(--mut);line-height:1.35;margin-top:2px}
.tile.na{border:1.5px dashed var(--line);background:transparent;opacity:.7}
.stg{display:flex;align-items:center;gap:12px}.stg .n{width:54px;height:54px;border-radius:16px;color:#fff;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
/* ---------- focus card ---------- */
.focus{display:flex;gap:12px;align-items:center}
.focus .ic{font-size:34px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px}
.btn.pri{background:var(--gold);color:#fff}
.btn.sec{background:var(--soft);color:var(--txt)}
.btn.line{background:transparent;border:1.5px solid var(--line);color:var(--txt)}
.btn.sm{padding:8px 14px;font-size:13.5px;border-radius:12px}
.btns{display:flex;gap:10px;margin-top:16px}.btns .btn{flex:1}
/* ---------- what-if ---------- */
.simtop{display:flex;align-items:center;justify-content:center;gap:16px;background:var(--soft);border-radius:16px;padding:10px;margin-bottom:6px}
.simtop div{text-align:center}.simtop b{font-size:28px;display:block;line-height:1.1}.simtop small{color:var(--mut);font-size:12.5px}
.srow{margin:12px 0}.srow .t{display:flex;justify-content:space-between;font-size:14px}
input[type=range]{width:100%;accent-color:var(--gold)}
/* ---------- wizard ---------- */
.prog{display:flex;gap:6px;margin:0 0 14px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog i.on{background:var(--gold)}
.q{margin:14px 0;padding:8px;border-radius:14px;border:1.5px solid transparent}.q.err{border-color:var(--low);background:rgba(210,87,59,.08)}
.ql{font-weight:700;margin-bottom:6px}.hint{font-size:13px;color:var(--mut);margin:-2px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:46px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--txt)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:700}
:root[data-theme="dark"] .chip.on{background:var(--gold);border-color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{background:var(--gold);border-color:var(--gold)}}
input[type=number],input[type=text],select{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:14px;font:inherit;background:var(--card);color:var(--txt)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;font-size:13.5px;color:var(--mut);margin-bottom:3px}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:15px}.chk input{width:22px;height:22px;margin-top:3px;accent-color:var(--navy)}
.avs{display:flex;flex-wrap:wrap;gap:8px}.avs button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-size:24px}
.avs button.on{border-color:var(--gold);background:var(--gold-l)}
.link{background:none;border:0;color:var(--gold);font-weight:700;padding:6px 0;text-decoration:underline}
/* ---------- goal ---------- */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.day{aspect-ratio:1;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;line-height:1.2}
.day b{font-size:16px}.day.done{background:var(--ok);border-color:var(--ok);color:#fff}.day.today{border-color:var(--gold);border-width:2.5px}.day.future{opacity:.4}
.sug{display:flex;gap:10px;align-items:center;width:100%;text-align:start;background:var(--soft);border:1.5px solid transparent;border-radius:16px;padding:12px;margin-bottom:8px;color:inherit}
.sug:active{border-color:var(--gold)}.sug .ic{font-size:26px}
.pbar{height:12px;background:var(--line);border-radius:6px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#E4B25A);border-radius:6px;transition:width .3s}
/* ---------- badges / profile ---------- */
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{text-align:center;background:var(--soft);border-radius:16px;padding:10px 4px;font-size:12.5px}
.bd span{display:block;font-size:28px}.bd.off{opacity:.38;filter:grayscale(1)}
.pill{display:inline-block;background:var(--soft);border-radius:12px;padding:5px 11px;margin:3px 3px 0 0;font-size:14px}
.code{direction:ltr;text-align:center;font-size:22px;font-weight:800;letter-spacing:3px;background:var(--gold-l);border-radius:14px;padding:10px;margin:6px 0}
/* ---------- nav ---------- */
nav{position:fixed;bottom:0;inset-inline:0;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav .in{display:flex;max-width:720px;width:100%;gap:4px}
nav button{flex:1;background:none;border:0;padding:6px;border-radius:14px;color:var(--mut);font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:0}
nav button span{font-size:22px;line-height:1.2}
nav button.on{color:var(--navy);background:var(--gold-l);font-weight:700}
:root[data-theme="dark"] nav button.on{color:var(--gold)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{color:var(--gold)}}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;max-width:720px;margin:0 auto}
.langb{border:1px solid var(--line,#cbd5e1);background:transparent;color:inherit;border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.topbar b{font-size:17px}.topbar small{color:var(--mut);display:block;font-size:12.5px}
.toast{position:fixed;bottom:96px;inset-inline:16px;max-width:420px;margin:0 auto;background:var(--navy);color:#fff;border-radius:14px;padding:10px 14px;font-size:14px;text-align:center;z-index:20;box-shadow:var(--shadow)}
.foot{font-size:12.5px;color:var(--mut);text-align:center;margin:6px 0 20px}
@media print{nav,.topbar,.btns,.noprint,.sim{display:none!important}body{background:#fff;padding:0}.card,.hero{box-shadow:none}}
</style>
</head>
<body>
<div id="top"></div>
<div class="wrap" id="app"></div>
<nav id="nav" class="hidden"><div class="in"></div></nav>
<div id="toast" class="toast hidden"></div>

<script>
/*I18N_START*/

function compute(A,M,age,sex){
  const sc={diet:sDiet(A),act:sAct(A.act),nic:sNic(A),sleep:sSleep(A.sleep),bmi:null,lipid:null,gluc:null,bp:null};
  const bmi=(M.h&&M.w)?M.w/Math.pow(M.h/100,2):null;
  if(bmi!==null)sc.bmi=sBmi(bmi);
  if(M.tc!=null&&M.hdl!=null)sc.lipid=sLip(M.tc-M.hdl);
  sc.gluc=sGlu(M);
  if(M.sbp!=null&&M.dbp!=null)sc.bp=sBp(M.sbp,M.dbp);
  const v=Object.values(sc).filter(x=>x!==null);
  const total=Math.round(v.reduce((a,b)=>a+b,0)/v.length);
  const egfr=M.cre!=null?egfrCalc(M.cre,age,sex):null;
  const refer=[],watch=[];
  if(M.sbp!=null){ if(M.sbp>=140||M.dbp>=90)refer.push(`ضغط الدم ${M.sbp}/${M.dbp} (أعد القياس مرتين بعد راحة 5 دقائق)`);
    else if(M.sbp>=130||M.dbp>=80)watch.push(`ضغط الدم ${M.sbp}/${M.dbp} أعلى من المثالي`); }
  if((M.a1c!=null&&M.a1c>=6.5)||(M.fg!=null&&M.fg>=126))refer.push('سكر الدم في نطاق يستحق التأكيد بتحليل');
  else if((M.a1c!=null&&M.a1c>=5.7)||(M.fg!=null&&M.fg>=100))watch.push('سكر الدم في نطاق ما قبل السكر');
  if(egfr!==null){ if(egfr<60)refer.push(`معدل الترشيح الكلوي المقدّر ${Math.round(egfr)} (يُعاد التحليل)`); else if(egfr<90)watch.push(`معدل الترشيح الكلوي ${Math.round(egfr)} أقل قليلًا من 90`); }
  if(M.uacr!=null){ if(M.uacr>=30)refer.push(`ألبومين البول ${M.uacr} مجم/جم (يُؤكَّد بتكرار التحليل)`); }
  if(bmi!==null){ if(bmi>=30)watch.push(`مؤشر كتلة الجسم ${bmi.toFixed(1)} (سمنة)`); else if(bmi>=25)watch.push(`مؤشر كتلة الجسم ${bmi.toFixed(1)} (زيادة وزن)`); else if(bmi<18.5)watch.push(`مؤشر كتلة الجسم ${bmi.toFixed(1)} أقل من المعدل`); }

  if(ckm.clin)refer.push('معدل الترشيح الكلوي أقل من 30: يلزم تقييم طبي عاجل');

}

  if(M.waist!=null)m.push(M.waist>=wc); if(M.tg!=null)m.push(M.tg>=150); if(M.hdl!=null)m.push(M.hdl<(sex==='F'?50:40));

  const metsN=m.filter(Boolean).length,mets=metsN>=3;
  const vals=Object.values(D);
  let stage=vals.some(d=>d.s==='f2')||mets?2:vals.some(d=>d.s==='f1')?1:0;
  return {D,measured:vals.length,stage,mets,metsN,clin:egfr!==null&&egfr<30,g,a};
}

/* =================== المعالج =================== */
function startWizard(mode){
  const le=lastEntry();
  W={mode,step:mode==='measures'?4:0,A:le?{...le.A}:{},M:le?{...le.M}:{},year:le?le.year:null,sex:le?le.sex:null,age:le?le.age:null};
  if(mode==='followup'&&!le&&P.recovered){W.A={};W.M={};}
  view='wizard'; setNav(false); renderWizard();
}
function chipsFor(f,cur){ return QS[f].o.map(o=>`<button type="button" class="chip${cur===o.v?' on':''}" data-f="${f}" data-v="${o.v}">${o.l}</button>`).join(''); }
function renderWizard(keep){
  const y=window.scrollY,s=STEPS[W.step];
  $('top').innerHTML=topbar();
  let body='';
  if(s.q){
    body=s.q.map(f=>{
      const q=QS[f];
      if(q.show&&!q.show(W.A))return '';
      const cur=(f==='year'||f==='sex')?W[f]:W.A[f];
      return `<div class="q" data-f="${f}"><div class="ql">${q.l}</div>${q.h?`<div class="hint">${q.h}</div>`:''}<div class="chips">${chipsFor(f,cur)}</div></div>`;
    }).join('');
    if(s.age)body+=`<div class="q" data-f="age"><div class="ql">السن</div><input type="number" id="age" min="17" max="45" inputmode="numeric" placeholder="مثال: 20" value="${W.age||''}"></div>`;
  } else {
    body=`<p class="sub">اختيارية، وغالبًا يسجلها فريق الفحص. اترك الحقل فارغًا إن لم يكن متاحًا. كلما زادت القياسات أصبحت درجتك أدق.</p><div class="grid2">`+
      MF.map(([k,l,ph])=>`<div><label class="f">${l}</label><input type="number" id="m_${k}" step="any" inputmode="decimal" placeholder="${ph}" value="${W.M[k]??''}"></div>`).join('')+`</div>`;
  }
  const last=W.step===STEPS.length-1;
  $('app').innerHTML=`<div class="prog">${STEPS.map((_,i)=>`<i class="${i<=W.step?'on':''}"></i>`).join('')}</div>
  <div class="card"><h2>${s.t}</h2>${body}
  <div class="btns">${W.step>0&&W.mode!=='measures'?'<button class="btn sec" id="pv">السابق</button>':'<button class="btn sec" id="cx">إلغاء</button>'}
  <button class="btn pri" id="nx">${last?'احسب نتيجتي':'التالي'}</button></div></div>`;
  document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
    const f=b.dataset.f,o=QS[f].o.find(x=>String(x.v)===b.dataset.v);
    if(f==='year'||f==='sex')W[f]=o.v; else W.A[f]=o.v;
    if(f==='smoke'){ if(W.A.smoke!=='former')delete W.A.quit; keepAge(); renderWizard(true); return; }
    b.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
    b.closest('.q').classList.remove('err');
  });
  if($('pv'))$('pv').onclick=()=>{keepAge();W.step--;renderWizard();window.scrollTo({top:0});};
  if($('cx'))$('cx').onclick=()=>{ if(lastEntry())goApp('dash'); else { store.clear(); P=null; startWelcome(); } };
  $('nx').onclick=nextStep;
  window.scrollTo({top:keep?y:0});
}
function keepAge(){ if($('age')){const a=+$('age').value; if(a)W.age=a;} }
function nextStep(){
  const s=STEPS[W.step]; let bad=[];
  if(s.q){
    s.q.forEach(f=>{const q=QS[f]; if(q.show&&!q.show(W.A))return; const v=(f==='year'||f==='sex')?W[f]:W.A[f]; if(v===undefined||v===null)bad.push(f);});
    if(s.age){const a=+$('age').value; if(!(a>=17&&a<=45))bad.push('age'); else W.age=a;}
    document.querySelectorAll('.q').forEach(q=>q.classList.toggle('err',bad.includes(q.dataset.f)));
    if(bad.length){const e=document.querySelector('.q.err'); if(e)e.scrollIntoView({behavior:'smooth',block:'center'}); return;}
    W.step++; renderWizard(); return;
  }
  const M={};
  for(const [k,,,lo,hi] of MF){ const v=$('m_'+k).value.trim(); if(v==='')continue; const n=+v; if(!(n>=lo&&n<=hi)){alert('يرجى مراجعة القياسات: توجد قيمة خارج المدى المنطقي.');return;} M[k]=n; }
  if((M.sbp==null)!==(M.dbp==null)){alert('أدخل الضغط الانقباضي والانبساطي معًا أو اتركهما فارغين.');return;}
  if((M.tc==null)!==(M.hdl==null)){alert('أدخل الكوليسترول الكلي وHDL معًا أو اتركهما فارغين.');return;}
  if(M.tc!=null&&M.hdl>=M.tc){alert('الكوليسترول HDL يجب أن يكون أقل من الكلي.');return;}
  W.M=M; finishWizard();
}
function finishWizard(){
  const res=compute(W.A,W.M,W.age,W.sex);
  const round=(!P.entries.length&&!P.recovered)?'baseline':'followup';
  const entry={ts:Date.now(),round,year:W.year,sex:W.sex,age:W.age,A:{...W.A},M:{...W.M},total:res.total,sc:res.sc,n:res.n};
  if(W.mode==='measures'&&P.entries.length){ const le=lastEntry(); entry.round=le.round; entry.ts=le.ts; P.entries[P.entries.length-1]=entry; }
  else P.entries.push(entry);
  store.set(P);
  send(entry,res);
  goApp('dash');
}

function renderApp(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('top').innerHTML=topbar();

  $('app').innerHTML = tab==='dash'?dashHTML(le,res):tab==='goal'?goalHTML(le,res):meHTML(le,res);
  if(tab==='dash')bindDash(le,res); if(tab==='goal')bindGoal(le,res); if(tab==='me')bindMe(le,res);
}

/* ---- مخطط الرادار ---- */
function radar(sc){
  const cx=140,cy=140,R=86,n=8,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let g='';
  [.25,.5,.75,1].forEach(f=>{g+=`<polygon points="${MET.map((_,i)=>pt(i,R*f).join(',')).join(' ')}" fill="none" stroke="var(--line)" stroke-width="1"/>`;});
  MET.forEach((_,i)=>{const [x,y]=pt(i,R);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;});
  const pts=MET.map((m,i)=>pt(i,R*((sc[m.k]??0)/100)));
  g+=`<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="rgba(198,145,46,.28)" stroke="var(--gold)" stroke-width="2.5" stroke-linejoin="round"/>`;
  MET.forEach((m,i)=>{
    const [x,y]=pts[i],has=sc[m.k]!==null;
    g+=`<circle cx="${x}" cy="${y}" r="${has?4.5:3}" fill="${has?colOf(sc[m.k]):'var(--card)'}" stroke="${has?'var(--card)':'var(--mut)'}" stroke-width="1.5"/>`;
    const [lx,ly]=pt(i,R+26);
    g+=`<text x="${lx}" y="${ly+6}" text-anchor="middle" font-size="19" opacity="${has?1:.4}">${m.i}</text>`;
  });
  return `<svg viewBox="0 0 280 280" width="100%" style="max-width:340px;display:block;margin:0 auto" role="img" aria-label="مخطط المؤشرات الثمانية">${g}</svg>`;
}

  const pri=scored.filter(m=>res.sc[m.k]<80).sort((a,b)=>res.sc[a.k]-res.sc[b.k]);
  const priSet=new Set(pri.slice(0,2).map(m=>m.k));
  const focus=pri.find(m=>m.beh)||pri[0];
  const daysSince=Math.floor((Date.now()-P.entries[0].ts)/864e5);
  const due=P.entries.length===1&&daysSince>=CONFIG.FOLLOWUP_DAYS;
  const dueDate=new Date(P.entries[0].ts+CONFIG.FOLLOWUP_DAYS*864e5);

     <circle cx="66" cy="66" r="56" fill="none" stroke="${L.c==='var(--ok)'?'#5BD3A0':L.c==='var(--mid)'?'#F2C14E':'#FF8A6B'}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-res.total/100)}"/></svg>
     <b>${res.total}<small>من 100</small></b></div>

function suggestions(res){

function trend(entries){

  const W_=300,H=120,pad=24,xs=entries.map((_,i)=>pad+i*(W_-2*pad)/(entries.length-1)),ys=entries.map(e=>H-pad-(e.total/100)*(H-2*pad));
  return `<svg viewBox="0 0 ${W_} ${H+16}" width="100%"><line x1="${pad}" x2="${W_-pad}" y1="${H-pad}" y2="${H-pad}" stroke="var(--line)"/>
   <polyline points="${xs.map((x,i)=>x+','+ys[i]).join(' ')}" fill="none" stroke="var(--gold)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
   ${entries.map((e,i)=>`<circle cx="${xs[i]}" cy="${ys[i]}" r="5" fill="var(--gold)"/><text x="${xs[i]}" y="${ys[i]-10}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${e.total}</text><text x="${xs[i]}" y="${H+10}" text-anchor="middle" font-size="9.5" fill="var(--mut)">${fmtDate(e.ts)}</text>`).join('')}</svg>`;
}
function badges(le,res){

    {i:'🎯',t:'حققت هدفًا',on:all.some(x=>x.count>=x.target)},
    {i:'🔥',t:'أسبوع كامل',on:all.some(x=>x.count>=7)},
    {i:'📈',t:'تحسّنت',on:P.entries.length>1&&le.total-first.total>=3},

  if(cur.uacr!=null)pills.push(`UACR <b>${cur.uacr}</b>`);
  if(cur.waist!=null)pills.push(`الخصر <b>${cur.waist}</b>`);
  if(cur.tg!=null)pills.push(`TG <b>${cur.tg}</b>`);
  return `<div class="wrap">
  <div class="card" style="text-align:center"><div class="avatar" style="width:72px;height:72px;font-size:40px;margin:0 auto 6px;background:var(--gold-l)">${esc(P.avatar)}</div>
   <h2>${nk(P.nick)}</h2><div class="sub" style="margin:0">${CONFIG.YEARS[le.year-1]} · ${le.sex==='F'?'أنثى':'ذكر'} · ${le.age} سنة</div>
   <div class="code">${esc(P.code)}</div><div class="tiny">احتفظ بهذا الكود: يربط متابعتك على أي جهاز بدون اسمك.</div>
   <div class="btns" style="justify-content:center"><button class="btn sec sm" id="cp">نسخ الكود</button><button class="btn sec sm" id="ed">تعديل الاسم والأيقونة</button></div>
   <div id="edBox" class="hidden" style="margin-top:12px;text-align:start"><input type="text" id="nn" maxlength="14" value="${nk(P.nick)}" style="text-transform:none;letter-spacing:0;direction:rtl;text-align:start">
    <div class="avs" style="margin-top:10px" id="avs2">${AVATARS.map(a=>`<button type="button" data-a="${a}" class="${a===P.avatar?'on':''}">${a}</button>`).join('')}</div>
    <div class="btns"><button class="btn pri sm" id="sv">حفظ</button></div></div></div>

  <div class="card"><h3>📈 تقدّمي</h3>${trend(P.entries)}
   ${P.entries.length>1?`<div class="sub" style="margin:8px 0 0">من ${first.total} إلى ${le.total} (${le.total-first.total>=0?'+':''}${le.total-first.total})</div>`:''}</div>

  <div class="card"><h3>🏅 إنجازاتي</h3><div class="badges">${badges(le,res).map(b=>`<div class="bd${b.on?'':' off'}"><span>${b.i}</span>${b.t}</div>`).join('')}</div></div>

  <div class="card"><h3>🩺 قياساتي</h3>${pills.length?pills.map(p=>`<span class="pill">${p}</span>`).join(''):'<div class="sub">لم تُسجَّل قياسات بعد.</div>'}
   <div class="btns"><button class="btn sec sm" id="ms">${pills.length?'تحديث القياسات':'إضافة القياسات'}</button></div></div>

  <div class="card"><h3>⚙️ خصوصيتي</h3><p class="sub">الاسم المستعار والأيقونة والأهداف محفوظة على هذا الجهاز فقط. ما يُرسل للبحث هو إجاباتك وقياساتك مع الكود المجهول.</p>
   <div class="btns"><button class="btn line sm" id="ex">تنزيل بياناتي</button><button class="btn line sm" id="dl" style="color:var(--low)">حذف بياناتي من هذا الجهاز</button></div>
   <div class="btns"><button class="btn line sm" id="th">تبديل الوضع الفاتح/الداكن</button></div></div>
  <div class="foot">الأداة للتوعية والبحث العلمي ولا تُغني عن الفحص الطبي أو التشخيص.</div></div>`;
}
function bindMe(le,res){
  $('cp').onclick=()=>{try{navigator.clipboard.writeText(P.code);toast('تم نسخ الكود');}catch(e){toast(P.code);}};
  $('ed').onclick=()=>$('edBox').classList.toggle('hidden');
  let av=P.avatar;
  document.querySelectorAll('#avs2 button').forEach(b=>b.onclick=()=>{av=b.dataset.a;document.querySelectorAll('#avs2 button').forEach(x=>x.classList.toggle('on',x===b));});
  $('sv').onclick=()=>{P.nick=$('nn').value.trim()||P.nick;P.avatar=av;store.set(P);renderApp();toast('تم الحفظ');};
  $('ms').onclick=()=>startWizard('measures');
  $('ex').onclick=()=>{const b=new Blob([JSON.stringify(P,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='my-health-data.json';a.click();};
  $('dl').onclick=()=>{if(confirm('سيُحذف ملفك من هذا الجهاز (يمكنك العودة بكودك '+P.code+'). متابعة؟')){store.clear();P=null;startWelcome();}};
  $('th').onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).getPropertyValue('--bg').trim()==='#0A1423';r.dataset.theme=dark?'light':'dark';};
}

/* =================== الخادم =================== */
function payload(e,res){
  const A=e.A,M=e.M,s=res.sc;
  return {round:e.round,code:P.code,year:e.year,sex:e.sex,age:e.age,
    fast:A.fast,fried:A.fried,salty:A.salty,sweets:A.sweets,veg:A.veg,coffee:A.coffee,tea:A.tea,energy:A.energy,cola:A.cola,water:A.water,
    caffeine_mg:res.mg,sodium_mg:res.na,smoke:A.smoke,quit:A.quit||'',second:A.second,sleep:A.sleep,regular:A.regular,act_min:A.act,sitting:A.sitting,
    sbp:M.sbp??'',dbp:M.dbp??'',height:M.h??'',weight:M.w??'',bmi:res.bmi===null?'':+res.bmi.toFixed(1),
    fg:M.fg??'',a1c:M.a1c??'',tc:M.tc??'',hdl:M.hdl??'',creatinine:M.cre??'',egfr:res.egfr===null?'':Math.round(res.egfr),uacr:M.uacr??'',
    waist:M.waist??'',tg:M.tg??'',ckm_stage:res.ckm.measured?(res.ckm.clin?3:res.ckm.stage):'',ckm_domains:res.ckm.measured,kdigo_g:res.ckm.g||'',kdigo_a:res.ckm.a||'',mets_n:res.ckm.metsN,
    le8:res.total,n_metrics:res.n,s_diet:s.diet,s_act:s.act,s_nic:s.nic,s_sleep:s.sleep,s_bmi:s.bmi??'',s_lipid:s.lipid??'',s_gluc:s.gluc??'',s_bp:s.bp??'',
    f_smoke:['cig','vape','both'].includes(A.smoke)?1:0,f_sleep:A.sleep<6?1:0,f_inactive:A.act<150?1:0,f_water:A.water<6?1:0,f_caff:res.mg>CONFIG.CAFF_LIMIT?1:0,
    f_refer:(res.n>4||e.M.sbp!=null||e.M.fg!=null||e.M.a1c!=null||e.M.cre!=null||e.M.uacr!=null)?(res.refer.length?1:0):'',
    goal_metric:P.goal?P.goal.metric:'',goals_done:(P.goalHistory||[]).filter(x=>x.count>=x.target).length+(P.goal&&Object.keys(P.goal.done).length>=P.goal.target?1:0),
    goal_days:goalDays(),arm:getArm(),plan_cue:(P.goal&&P.goal.cue)||((P.goalHistory||[]).slice(-1)[0]||{}).cue||'',
    note:res.refer.join(' | ')};
}
async function send(e,res){
  if(!CONFIG.API_URL){toast('وضع تجريبي: لم تُحفظ المشاركة على الخادم');return;}
  try{
    const r=await fetch(CONFIG.API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload(e,res))});
    const j=await r.json(); toast(j.ok?'✓ تم حفظ مشاركتك، شكرًا لك':'تعذر الحفظ: '+(j.error||'خطأ'));
  }catch(err){toast('تعذر الاتصال بالخادم، حاول لاحقًا');}
}
async function loadPeer(le,res){
  if(!CONFIG.API_URL)return;
  try{
    const r=await fetch(CONFIG.API_URL+'?action=stats&year='+le.year),j=await r.json();
    if(j.ok&&j.avg!==null&&$('peer'))$('peer').innerHTML=`<div class="card"><h3>👥 مقارنة مجهولة مع فرقتك</h3><div class="sub" style="margin:0">متوسط ${CONFIG.YEARS[le.year-1]}: <b>${j.avg}</b> (${j.n} مشاركًا بدون أسماء) · درجتك: <b>${res.total}</b></div></div>`;
  }catch(e){}
}

boot();
</script>
</body>
</html>
